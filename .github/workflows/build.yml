name: build（makepkg → release linux-zen1th）
on:
  repository_dispatch:
    types: [integration-ready]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pkg:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    timeout-minutes: 300
    steps:
      - name: 系統準備
        run: |
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed base-devel git bc flex bison openssl python perl rsync cpio zstd libtraceevent pahole
          useradd -m builder
      - name: 取整合分支
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          # 倉是 private：匿名 clone 會要憑證（run 42419179952 實測 exit 128）。
          # clone 一次到 runner 本體（root），換 builder 擁有後再進容器看不到——
          # 這個 step 與 makepkg 同 job 但 container 全域，直接帶 token clone。
          git clone -q --branch zen1th "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /home/builder/src
          git -C /home/builder/src remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          chown -R builder:builder /home/builder/src
      - name: git 憑證改寫（private 倉）
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          # pacman 7.1 的 makepkg 對 git 來源下載封死一般 config 層
          # （/usr/share/makepkg/source/git.sh:31-32）：
          #   GIT_CONFIG_GLOBAL=/dev/null、GIT_CONFIG_SYSTEM=${MAKEPKG_GIT_CONFIG:-/etc/makepkg.d/gitconfig}
          # ——#13–#16 四連紅都在錯誤的層寫憑證。唯一正解：寫 /etc/makepkg.d/gitconfig。
          install -d /etc/makepkg.d
          git config -f /etc/makepkg.d/gitconfig url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config -f /etc/makepkg.d/gitconfig --get-regexp insteadOf
      - name: makepkg
        run: |
          su builder -c 'cd /home/builder/src && HOME=/home/builder JOBS=$(nproc) makepkg -fs --noconfirm'
      - name: 產物自檢（收口：壞包就紅，不發假包）
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(/home/builder/src/linux-zen1th-*.pkg.tar.zst)
          [ ${#pkgs[@]} -ge 2 ] || { echo "缺 package 產物"; exit 1; }
          pkg=( $(ls /home/builder/src/linux-zen1th-[0-9]*.pkg.tar.zst) )
          # ⚠️ 一律「整包清單/內容先讀進變數，再 grep 變數」，禁 `tar -tf | grep -q` 直管：
          # run #10（42448783154）實測——包裡明明有 boot/vmlinuz-7.4.0rc1.…，
          # 但 grep -q 命中即關管道，tar 吃 SIGPIPE 回 141，pipefail 讓整條管線 rc=141，
          # || 分支誤報「包內無 vmlinuz」收口紅。本地 61MB 合成 tar 重現同型（外層 rc=141）。
          # 另原 `tar -xOf pkg ./boot/config-*` 在 nullglob 下萬用字元對「解壓後的檔名」
          # 展開＝空展開成零參數＝整個 tar 倒 stdout，同樣只能先取成員名再解。
          listing=$(tar -tf "${pkg[0]}")
          grep -q 'boot/vmlinuz-' <<<"$listing" || { echo "包內無 vmlinuz"; exit 1; }
          grep -q 'lib/modules/.*kernel/drivers/gpu/drm/amd/amdgpu/amdgpu.ko' <<<"$listing" || { echo "amdgpu 模組缺失"; exit 1; }
          grep -q 'lib/modules/.*/kernel/drivers/net/wireless/realtek/rtw89/rtw89_8852ae.ko' <<<"$listing" || { echo "RTL8852AE 模組缺失"; exit 1; }
          cfg=$(grep '^.*boot/config-' <<<"$listing" | head -1)
          [ -n "$cfg" ] || { echo "包內無 boot/config-*"; exit 1; }
          cfgtext=$(tar -xOf "${pkg[0]}" "$cfg")
          grep -qx 'CONFIG_BLK_DEV_NVME=y' <<<"$cfgtext" || { echo "包內 config NVME 非 y"; exit 1; }
          # 關掉 X86_NATIVE_CPU 是硬閘：CI runner 不是目標機，誤開會編出 runner
          # 專用指令集的內核，裝到 Zen 3 上開不了機。
          grep -qx '# CONFIG_X86_NATIVE_CPU is not set' <<<"$cfgtext" || { echo "包內 config 誤開 X86_NATIVE_CPU"; exit 1; }
          # 手機 USB 網絡共享（realme 實測 cdc_ncm/cdc_ether）：父項與子項都要在，
          # 只有子項時 localmodconfig 會讓整組 USB net 消失（2026-11-08 實錘）。
          for opt in CONFIG_USB_NET_DRIVERS=m CONFIG_USB_USBNET=m \
                     CONFIG_USB_NET_CDCETHER=m CONFIG_USB_NET_CDC_NCM=m \
                     CONFIG_USB_NET_CDC_MBIM=m CONFIG_USB_NET_RNDIS_HOST=m; do
            grep -qx "$opt" <<<"$cfgtext" || { echo "包內 config 缺 $opt"; exit 1; }
          done
          # headers 包必須含完整 DKMS 編譯樹，不能只有 usr/include。
          hpkg=( $(ls /home/builder/src/linux-zen1th-headers-[0-9]*.pkg.tar.zst) )
          [ ${#hpkg[@]} -eq 1 ] || { echo "缺 headers 產物"; exit 1; }
          hlisting=$(tar -tf "${hpkg[0]}")
          grep -q '^usr/src/linux-headers-' <<<"$hlisting" || { echo "headers 缺 /usr/src 編譯樹"; exit 1; }
          grep -qE '^(usr/lib|lib)/modules/.*/build$' <<<"$hlisting" || { echo "headers 缺 lib/modules/.../build"; exit 1; }
          ls -l /home/builder/src/*.pkg.tar.zst
          du -h /home/builder/src/*.pkg.tar.zst | awk '{print $1, $2}'
      - name: 發佈到 current-kernel release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: current-kernel
          name: linux-zen1th current（UTC+8 自動重建）
          body: merge-bot 整合完成自動構建。SHA256 見附檔。
          files: |
            /home/builder/src/linux-zen1th-*.pkg.tar.zst
            /home/builder/src/linux-zen1th-*.pkg.tar.zst.sig
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SHA256SUMS
        run: |
          cd /home/builder/src
          sha256sum linux-zen1th-*.pkg.tar.zst > SHA256SUMS-kernel
      - name: 上傳 SHA256
        uses: softprops/action-gh-release@v2
        with:
          tag_name: current-kernel
          files: /home/builder/src/SHA256SUMS-kernel
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
