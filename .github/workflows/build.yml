name: build（makepkg → release linux-zen1th）
on:
  repository_dispatch:
    types: [integration-ready]
  workflow_dispatch:
  # 2026-11-25 用戶要求：zen1th 脫離自動構建倉（repo/current-repo），
  # 由本倉自己每 3 小時檢查 + 構建 + 發佈成 pacman 可直接吃的倉庫 release。
  # merge-bot 每輪整合會推 zen1th 快照分支；本 workflow 的「版本未變即跳過」
  # 步驟保證定時觸發不會對同一版本重做 150 分鐘的內核編譯。
  schedule:
    - cron: '0 */3 * * *'
permissions:
  contents: write
concurrency:
  group: zen1th-build
  # 定時觸發排队等前一輪跑完（內核編譯 150 分鐘 > 3 小時間隔時也不互相掐死）；
  # 手動/dispatch 則取代舊的。
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  pkg:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    timeout-minutes: 300
    steps:
      - name: 系統準備
        if: steps.check.outputs.skip != 'true'
        run: |
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syu --noconfirm --needed base-devel git bc flex bison openssl python perl rsync cpio zstd libtraceevent pahole
          useradd -m builder
      - name: 定时触发先查版本（未变则跳过，避免每 3 小时白编 150 分钟）
        id: check
        if: github.event_name == 'schedule'
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -euo pipefail
          # 远端 zen1th-repo 的 DB 裡最新 pkgver vs 整合分支 PKGBUILD 的 pkgver。
          # 相同代表 merge-bot 這 3 小時沒產出新核心 ⇒ 直接跳過，省 CPU/分鐘數。
          remote=$(curl -fsSL --max-time 30 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/zen1th-repo" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((a["name"] for a in d.get("assets",[]) if a["name"].startswith("linux-zen1th-") and "headers" not in a["name"]), ""))' 2>/dev/null || true)
          # PKGBUILD 的 pkgver 是占位（0.r0.g0000000），真版本由 pkgver() 從快照
          # 計算（版本.r日期.g<sha>）。所以比「zen1th 分支 HEAD sha」與遠端包名 sha。
          head_sha=$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
                       refs/heads/zen1th 2>/dev/null | awk '{print substr($1,1,10)}' || true)
          echo "远端包: ${remote:-无} / 本轮快照 sha: ${head_sha:-无}"
          if [ -n "$remote" ] && [ -n "$head_sha" ] && [[ "$remote" == *"g${head_sha}-"* ]]; then
            echo "版本未变，跳过本轮定时构建"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 取整合分支
        if: steps.check.outputs.skip != 'true'
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          # 倉是 private：匿名 clone 會要憑證（run 42419179952 實測 exit 128）。
          # clone 一次到 runner 本體（root），換 builder 擁有後再進容器看不到——
          # 這個 step 與 makepkg 同 job 但 container 全域，直接帶 token clone。
          git clone -q --branch zen1th "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /home/builder/src
          git -C /home/builder/src remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          chown -R builder:builder /home/builder/src
      - name: git 憑證改寫（private 倉）
        if: steps.check.outputs.skip != 'true'
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          # pacman 7.1 的 makepkg 對 git 來源下載封死一般 config 層
          # （/usr/share/makepkg/source/git.sh:31-32）：
          #   GIT_CONFIG_GLOBAL=/dev/null、GIT_CONFIG_SYSTEM=${MAKEPKG_GIT_CONFIG:-/etc/makepkg.d/gitconfig}
          # ——#13–#16 四連紅都在錯誤的層寫憑證。唯一正解：寫 /etc/makepkg.d/gitconfig。
          install -d /etc/makepkg.d
          git config -f /etc/makepkg.d/gitconfig url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config -f /etc/makepkg.d/gitconfig --get-regexp insteadOf
      - name: makepkg
        if: steps.check.outputs.skip != 'true'
        run: |
          su builder -c 'cd /home/builder/src && HOME=/home/builder JOBS=$(nproc) makepkg -fs --noconfirm'
      - name: 產物自檢（收口：壞包就紅，不發假包）
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(/home/builder/src/linux-zen1th-*.pkg.tar.zst)
          [ ${#pkgs[@]} -ge 2 ] || { echo "缺 package 產物"; exit 1; }
          pkg=( $(ls /home/builder/src/linux-zen1th-[0-9]*.pkg.tar.zst) )
          # ⚠️ 一律「整包清單/內容先讀進變數，再 grep 變數」，禁 `tar -tf | grep -q` 直管：
          # run #10（42448783154）實測——包裡明明有 boot/vmlinuz-7.4.0rc1.…，
          # 但 grep -q 命中即關管道，tar 吃 SIGPIPE 回 141，pipefail 讓整條管線 rc=141，
          # || 分支誤報「包內無 vmlinuz」收口紅。本地 61MB 合成 tar 重現同型（外層 rc=141）。
          # 另原 `tar -xOf pkg ./boot/config-*` 在 nullglob 下萬用字元對「解壓後的檔名」
          # 展開＝空展開成零參數＝整個 tar 倒 stdout，同樣只能先取成員名再解。
          listing=$(tar -tf "${pkg[0]}")
          grep -q 'boot/vmlinuz-' <<<"$listing" || { echo "包內無 vmlinuz"; exit 1; }
          grep -q 'lib/modules/.*kernel/drivers/gpu/drm/amd/amdgpu/amdgpu.ko' <<<"$listing" || { echo "amdgpu 模組缺失"; exit 1; }
          grep -q 'lib/modules/.*/kernel/drivers/net/wireless/realtek/rtw89/rtw89_8852ae.ko' <<<"$listing" || { echo "RTL8852AE 模組缺失"; exit 1; }
          cfg=$(grep '^.*boot/config-' <<<"$listing" | head -1)
          [ -n "$cfg" ] || { echo "包內無 boot/config-*"; exit 1; }
          cfgtext=$(tar -xOf "${pkg[0]}" "$cfg")
          grep -qx 'CONFIG_BLK_DEV_NVME=y' <<<"$cfgtext" || { echo "包內 config NVME 非 y"; exit 1; }
          # 關掉 X86_NATIVE_CPU 是硬閘：CI runner 不是目標機，誤開會編出 runner
          # 專用指令集的內核，裝到 Zen 3 上開不了機。
          grep -qx '# CONFIG_X86_NATIVE_CPU is not set' <<<"$cfgtext" || { echo "包內 config 誤開 X86_NATIVE_CPU"; exit 1; }
          # 手機 USB 網絡共享（realme 實測 cdc_ncm/cdc_ether）：父項與子項都要在，
          # 只有子項時 localmodconfig 會讓整組 USB net 消失（2026-11-08 實錘）。
          for opt in CONFIG_USB_NET_DRIVERS=m CONFIG_USB_USBNET=m \
                     CONFIG_USB_NET_CDCETHER=m CONFIG_USB_NET_CDC_NCM=m \
                     CONFIG_USB_NET_CDC_MBIM=m CONFIG_USB_NET_RNDIS_HOST=m; do
            grep -qx "$opt" <<<"$cfgtext" || { echo "包內 config 缺 $opt"; exit 1; }
          done
          # headers 包必須含完整 DKMS 編譯樹，不能只有 usr/include。
          hpkg=( $(ls /home/builder/src/linux-zen1th-headers-[0-9]*.pkg.tar.zst) )
          [ ${#hpkg[@]} -eq 1 ] || { echo "缺 headers 產物"; exit 1; }
          hlisting=$(tar -tf "${hpkg[0]}")
          grep -q '^usr/src/linux-headers-' <<<"$hlisting" || { echo "headers 缺 /usr/src 編譯樹"; exit 1; }
          grep -qE '^(usr/lib|lib)/modules/.*/build$' <<<"$hlisting" || { echo "headers 缺 lib/modules/.../build"; exit 1; }
          ls -l /home/builder/src/*.pkg.tar.zst
          du -h /home/builder/src/*.pkg.tar.zst | awk '{print $1, $2}'
      - name: SHA256SUMS
        if: steps.check.outputs.skip != 'true'
        run: |
          cd /home/builder/src
          sha256sum linux-zen1th-*.pkg.tar.zst > SHA256SUMS-kernel
      - name: 建立 zen1th pacman 仓库 DB（repo-add，本仓直接可供 pacman -Syu）
        if: steps.check.outputs.skip != 'true'
        run: |
          cd /home/builder/src
          set -euo pipefail
          # 2026-11-25 用户要求：zen1th 从 repo/current-repo 拆出，
          # 本仓自己发布一个 pacman 可直接吃的仓库 release（zen1th-repo）。
          mkdir -p deploy
          cp linux-zen1th-*.pkg.tar.zst deploy/
          cd deploy
          # repo-add -R 先移除旧同名条目再加入；DB 只含本轮最新一对。
          repo-add -R -p zen1th.db.tar.gz ./*.pkg.tar.zst
          ls -lh zen1th.db* zen1th.files* *.pkg.tar.zst
          # 自检：DB 必须有 kernel + headers 两条。
          tar -tzf zen1th.db.tar.gz | grep -q '^linux-zen1th-[0-9]' || { echo "DB 缺 kernel"; exit 1; }
          tar -tzf zen1th.db.tar.gz | grep -q '^linux-zen1th-headers-[0-9]' || { echo "DB 缺 headers"; exit 1; }
      - name: 发布 zen1th pacman 仓库（zen1th-repo tag，latest tag 唯一）
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zen1th-repo
          name: zen1th pacman repository（每 3 小时自动检查，只留最新核心）
          body: |
            linux-zen1th 自建 pacman 仓库。pacman.conf 加：
            [zen1th]
            Server = https://github.com/Capricornus007/linux-zen1th/releases/download/zen1th-repo
            SigLevel = Never
            本 release 即 latest（历史 tag make_latest=false），顺应「github latest tag 只留最新」决定。
          files: |
            /home/builder/src/deploy/zen1th.db.tar.gz
            /home/builder/src/deploy/zen1th.db
            /home/builder/src/deploy/zen1th.files.tar.gz
            /home/builder/src/deploy/zen1th.files
            /home/builder/src/deploy/linux-zen1th-*.pkg.tar.zst
            /home/builder/src/SHA256SUMS-kernel
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 清理 zen1th-repo 旧资源（只留最新一組 + DB）
        if: steps.check.outputs.skip != 'true'
        run: |
          # softprops 更新 release 不会删旧 asset；列举后删掉非本轮文件名。
          cd /home/builder/src
          KEEP=$(basename $(ls linux-zen1th-[0-9]*.pkg.tar.zst | head -1))
          HOLD=$(basename $(ls linux-zen1th-headers-[0-9]*.pkg.tar.zst | head -1))
          for a in $(gh api repos/${GITHUB_REPOSITORY}/releases/tags/zen1th-repo \
                       --jq '.assets[].name' 2>/dev/null); do
            case "$a" in
              "$KEEP"|"$HOLD"|zen1th.db*|zen1th.files*|SHA256SUMS-kernel) ;;
              *) gh release delete-asset zen1th-repo "$a" --repo "${GITHUB_REPOSITORY}" -y >/dev/null 2>&1 && echo "删旧 $a" ;;
            esac
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 历史版本归档（每个版本单独 tag）
        if: steps.check.outputs.skip != 'true'
        run: |
          cd /home/builder/src
          # 从包名提取版本 tag：linux-zen1th-<ver>-1-x86_64.pkg.tar.zst → zen1th-<ver>
          P=$(ls linux-zen1th-[0-9]*.pkg.tar.zst | head -1)
          VER=$(printf '%s' "$P" | sed -E 's/^linux-zen1th-(.+)-1-x86_64\.pkg\.tar\.zst$/\1/')
          TAG="zen1th-${VER}"
          echo "归档 tag: $TAG"
          # 只把實際存在的檔案傳給 archive：release-manage.py 對不存在檔案
          # 會 ::error:: + exit 1。*.sig 從未生成（無 GPG 步驟/SigLevel=Never），
          # 之前就是把字面 glob 傳進去才讓整個歸檔步驟紅燈（run 45333187989）。
          FILES=$(ls linux-zen1th-[0-9]*.pkg.tar.zst SHA256SUMS-kernel 2>/dev/null)
          python3 ci/release-manage.py archive "$TAG" $FILES
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
