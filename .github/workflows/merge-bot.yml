name: merge-bot（next ⊕ zen ⊕ xanmod ⊕ bore ⊕ cjktty，差量補丁制）
on:
  schedule:
    - cron: "0 1 * * *"   # 每日 09:00 UTC+8
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { path: meta, fetch-depth: 0 }

      - name: 整合
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config --global user.email "zen1th-bot@users.noreply.github.com"
          git config --global user.name  "zen1th-merge-bot"
          git config --global advice.detachedHead false
          GITURL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          NEXTURL="https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git"
          cd meta
          # （旧的「增量：整合分支←next 尖端」路徑已刪除——zen1th 現在是無上游歷史的
          #   單提交快照分支，沒有共同祖先可 merge；且全量重組只要 ~10 分鐘，每日全量。）

          echo "=== 全量：差量補丁制重組 ==="
          git init -q src; cd src
          git remote add next   "$NEXTURL"
          git remote add zen    https://github.com/zen-kernel/zen-kernel.git
          git remote add xanmod https://gitlab.com/xanmod/linux.git
          git remote add lin    https://github.com/torvalds/linux.git
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          git fetch --filter=blob:none -q next    master:refs/remotes/next/master
          git fetch --filter=blob:none -q lin     master:refs/remotes/lin/master
          git fetch --filter=blob:none -q stable  linux-7.3.y:refs/remotes/stable/linux-7.3.y
          git fetch -q zen    master:refs/remotes/zen/master
          git fetch -q xanmod 7.3:refs/remotes/xanmod/7.3
          git checkout -q -b zen1th next/master

          # 差量基準＝ fork 與權威錨分支的 merge-base。
          # 教訓（run 42388018642）：用「最後一個 Merge tag 'v…」當錨點對 zen 完全失效——
          # zen master 已整個重基到 vanilla 7.4-rc1（樹內全是 Linus 自己的 merge tag），
          # grep 會錨到一年前的舊標籤，差量變成「14 個月全部 stable」，逐檔套用 857 衝突。
          # merge-base 對「跟 Linus 走（無 sauce）」回空差量、對「已疊 sauce」回淨 sauce，
          # 兩種情況都正確。
          make_netdiff() { # $1=fork-ref $2=anchor-ref $3=輸出檔
            local b
            b=$(git merge-base "$1" "$2" 2>/dev/null) || b=""
            if [ -z "$b" ]; then
              echo "$1 與 $2 無共同歷史（merge-base 失敗）"; return 1
            fi
            # 排除：文書、純裝飾檔（CREDITS/MAINTAINERS 署名）、頂層 Makefile（版本號裝飾，
            # 版本由 next 基座決定）；保留 arch/x86/Makefile 等真編譯改動
            git diff --binary "$b" "$1" -- . \
              ':!Documentation' ':!CREDITS' ':!MAINTAINERS' ':!Makefile' \
              ':!LICENSES' ':!README' > "$3"
            echo "$1 差量：$(wc -l < "$3") 行（基準 ${b:0:12} ＝ merge-base($2)，已排除裝飾檔）"
          }
          make_netdiff zen/master     lin/master            /tmp/zen.diff || { echo "::error::zen 差量計算失敗"; exit 1; }
          make_netdiff xanmod/7.3     stable/linux-7.3.y    /tmp/xan.diff || { echo "::error::xanmod 差量計算失敗"; exit 1; }

          apply_diff() { # $1=檔 $2=名稱 $3=required(yes/no)
            # yes：任一衝突即紅（缺了會開不了機/丟特性）。
            # no ：最佳努力層（第三方 sauce 對 next 基座必然漂移）——能套的全套，
            #      衝突檔記清單＋::warning:: 後繼續；清單照常推 zen1th-conflicts 分支。
            if [ ! -s "$1" ]; then echo "$2：差量為空（fork 無自有修改），跳過"; return 0; fi
            if git apply --check --3way "$1" 2>/dev/null; then
              git apply --3way "$1" && git add -A && git commit -qm "$2（差量乾淨）"; return
            fi
            echo "$2：整檔 3way 不行，逐檔套用…"
            local f ok=1 n_apply=0 n_fail=0
            git apply --numstat "$1" | cut -f3 > /tmp/files.txt
            while IFS= read -r f; do
              if git apply --3way --include="$f" "$1" 2>/dev/null; then
                n_apply=$((n_apply+1))
              else
                n_fail=$((n_fail+1)); ok=0
                # git apply --3way 失敗會把 <<<<<<< 衝突標記留檔並 stage（rc!=0 不清場）。
                # 不清掉的話標記會被 commit 進整合分支→編譯必炸。回退到本層起點：
                # HEAD 有這檔→checkout 還原；HEAD 沒有（diff 想新增、但上游早已把該檔
                # 搬走,如 drivers/android/binder.c→binder/,run #16）→清掉新增檔案。
                if git cat-file -e "HEAD:$f" 2>/dev/null; then
                  git checkout HEAD -- "$f"
                else
                  git rm -q -f --cached -- "$f" 2>/dev/null || true
                  rm -f "$f"
                fi
                echo "$2 衝突檔（已回退保留基座版）：$f" | tee -a "$RUNNER_TEMP/conflicts.txt"
              fi
            done < /tmp/files.txt
            echo "$2：套用 $n_apply 檔、衝突 $n_fail 檔"
            git add -A; git commit -qm "$2（逐檔套用 $n_apply 檔）" || true
            if [ "$ok" = 0 ]; then
              if [ "$3" = yes ]; then
                echo "::error::$2 有 $n_fail 個衝突檔（清單見 zen1th-conflicts 分支）"; exit 1
              fi
              echo "::warning::$2 有 $n_fail 個衝突檔未套用（best-effort 層；清單見 zen1th-conflicts 分支）"
            fi
          }
          # BORE：若 zen/xanmod 差量已帶來 SCHED_BORE 就不再疊 CachyOS 補丁（避免重複定義）
          if grep -q 'SCHED_BORE' zen.diff xan.diff 2>/dev/null || grep -qr 'config SCHED_BORE' kernel/sched/Kconfig kernel/sched/ 2>/dev/null; then
            echo "SCHED_BORE 已在疊加棧內（lqx/zen 自帶），跳過 CachyOS BORE 補丁"
            grep -qr 'config SCHED_BORE' kernel/sched/ && git log -1 --format='bore-source: %s' 
          else
            # 優先用 BORE 官方（firelzrd/bore-scheduler）對「本基座 kernelversion」發布的
            # 正式檔；CachyOS 目錄版滯後半個週期,對 next 基座會 fair.c 衝突
            # （run 42398532726：官方對 7.4-rc1 的 7.0.1 已合入 next 基座上下文）。
            # kernelversion 對 rc 會多出 .0（7.4.0-rc1）；BORE 官方檔名用 7.4-rc1——去 .0
            KVER=$(make -s kernelversion | sed -E 's/^([0-9]+\.[0-9]+)\.0(-|$)/\1\2/')
            # 匿名 api.github.com 在 runner 上會 403 rate-limit（失敗曾被 || true 吞掉、
            # 誤報「官方尚無補丁」）——帶 GITHUB_TOKEN，且 API 失敗直接紅、不靜默退回。
            BLIST_JSON=$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/firelzrd/bore-scheduler/contents/patches/testing") \
              || { echo "::error::bore-scheduler 檔列表 API 請求失敗"; exit 1; }
            BLIST=$(printf '%s' "$BLIST_JSON" | jq -r '.[].name' | grep -E "^0001-linux${KVER}(-rc[0-9]+)?-bore-" | sort -V | tail -1 || true)
            [ -n "$BLIST" ] || echo "::warning::BORE 官方確無 $KVER 補丁（列表已抓、無匹配檔）" 
            if [ -n "$BLIST" ]; then
              curl -fsSLO "https://raw.githubusercontent.com/firelzrd/bore-scheduler/main/patches/testing/${BLIST}"
              if git apply --check --3way "$BLIST" 2>/dev/null; then
                git apply --3way "$BLIST"
              elif patch -Np1 --dry-run < "$BLIST" >/dev/null 2>&1; then
                patch -Np1 < "$BLIST"
              else
                # xanmod best-effort 層改過 fair.c 等檔案的上下文（run #9：官方對 vanilla
                # 7.4-rc1 的 patch 卡 fair.c hunk#2）。git apply --3way 衝突會把 marker
                # 寫進檔案，故任一檔衝突→那些檔案先 checkout 回 next 原版再 3way 重套
                # （xanmod 對該檔的 sauce 丟棄，衝突清單已另存 zen1th-conflicts 分支）。
                echo "BORE 官方 patch 直套失敗，改用 git 3way…"
                # run: 是 bash -e：--3way 遇衝突 rc!=0，不吞掉會直接死在本行、到不了 checkout
                git apply --3way "$BLIST" 2>/dev/null || true
                if git diff --name-only --diff-filter=U | grep -q .; then
                  for f in $(git diff --name-only --diff-filter=U); do
                    echo "3way 衝突檔（checkout 回 next 原版後重套該檔）：$f" | tee -a "$RUNNER_TEMP/conflicts.txt"
                  done
                  git diff --name-only --diff-filter=U | xargs -r git checkout next/master --
                  git apply --3way "$BLIST"
                  git diff --name-only --diff-filter=U | grep -q . && { echo "::error::BORE 3way 仍衝突"; exit 1; }
                fi
              fi
              git add -A; git commit -qm "bore（BORE 官方 $BLIST）"
            else
              echo "::warning::BORE 官方尚無 $KVER 的補丁,退回 CachyOS 目錄版"
              MAJ=$(awk '/^VERSION/{v=$3}/^PATCHLEVEL/{p=$3}END{print v"."p}' Makefile)
              curl -fsSLO "https://raw.githubusercontent.com/CachyOS/kernel-patches/master/${MAJ}/sched/0001-bore-cachy.patch"
              patch -Np1 < "0001-bore-cachy.patch" || { echo "::error::CachyOS BORE 補丁衝突"; exit 1; }
              git add -A; git commit -qm "bore（CachyOS ${MAJ}）"
            fi
          fi

          # zen：merge-base 修法後其差量≈0（zen 已無自有 sauce）；真出現 sauce 衝突要紅，
          #      因為 zen 的 scheduler/MM sauce 是用戶點名要的。
          apply_diff /tmp/zen.diff "zen 優化" yes
          # xanmod：官方跟 stable 走、沒有 7.4/rc 分支，sauce 對 next 基座必然漂移
          #        （run 42394838953：binder/tcp/vmscan 17 檔）。最佳努力保留。
          apply_diff /tmp/xan.diff "xanmod 優化" no

          CJ=https://raw.githubusercontent.com/Capricornus007/cjktty-patches/master
          # v7.x/cjktty-7.4-rc1.patch（57MB）已內含 32x32 CJK 字型資料與 fonts.c/Makefile/Kconfig
          # 全部段（run #14 實測：再套舊的 cjktty-add-cjk32x32-font-data.patch 會
          # 「Reversed (or previously applied)」生 .rej 紅燈）——cj2 步驟刪除。
          curl -fsSL -o /tmp/cj1.patch "$CJ/v7.x/cjktty-7.4-rc1.patch"
          test "$(wc -c < /tmp/cj1.patch)" -gt 50000000 || { echo "::error::cjktty 補丁下載不完整"; exit 1; }
          patch -Np1 < /tmp/cj1.patch || { echo "::error::cjktty 補丁衝突"; exit 1; }
          git add -A; git commit -qm "cjktty v7.x"

          mkdir -p config ci
          # cwd 是 meta/src（checkout 到 meta 後才 git init src），上層就是 meta 本身；
          # 寫 ../meta 會解析成 meta/meta——run #17 就是在這 cp 失敗。
          cp ../config/* config/; cp ../ci/* ci/
          cp ../pkgbuild/PKGBUILD PKGBUILD
          # next 樹的 .gitignore 自帶 `/PKGBUILD` 與 `.*` 規則，`git add -A` 會靜默跳過
          # PKGBUILD 與 .scm_version（run #21「nothing to commit」實錘）→ 必須 add -f。
          git add -A; git add -f PKGBUILD
          git commit -qm "zen1th meta: PKGBUILD/config/keep/lsmod"
          # ===== zen1th 推「無上游歷史的單提交快照」=====
          # run #16–#19 四連紅實證：把 270 萬 commit 的 next 史＋整棵樹一次送進
          # GitHub HTTP 後端必 500（unpack 階段的後端限制，postBuffer/HTTP1.1/
          # 重試/分段/blob 分離全數無效）。zen1th 的消費者只有 build.yml 的
          # `git clone --branch zen1th`＋makepkg，它要的是「樹」不是上游歷史——
          # 所以把整合結果壓成單提交（父=上一個快照，讓 build 端 clone 增量最小、
          # 歷史上限 30 個提交可回滾），樹裡再放 .scm_version 記錄真實 next commit。
          NEXTSHA=$(git rev-parse next/master)
          git rm -q --cached .scm_version 2>/dev/null || true
          echo "$NEXTSHA" > .scm_version
          git add -A; git add -f .scm_version
          git commit -qm "zen1th snapshot $(date -u +%F) next=${NEXTSHA:0:12}" || true
          # 推送前硬校驗：build.yml 靠根目錄 PKGBUILD 活命，缺了必須在源頭紅（#21 教訓）。
          git ls-tree HEAD --name-only | grep -qx PKGBUILD || { echo "::error::快照樹缺 PKGBUILD"; exit 1; }
          git ls-tree HEAD --name-only | grep -qx .scm_version || { echo "::error::快照樹缺 .scm_version"; exit 1; }
          TREE=$(git rev-parse 'zen1th^{tree}')
          PARENT=$(git ls-remote "$GITURL" refs/heads/zen1th | awk '{print $1}')
          if [ -n "$PARENT" ] && ! git cat-file -e "$PARENT" 2>/dev/null; then
            git fetch -q "$GITURL" "refs/heads/zen1th:refs/remotes/prev/zen1th" && PARENT=$(git rev-parse refs/remotes/prev/zen1th)
          fi
          SNAP=$(git commit-tree "$TREE" ${PARENT:+-p "$PARENT"} -m "zen1th integration $(date -u +%F) next=${NEXTSHA:0:12} bore+cjktty zen xanmod(best-effort)")
          # 父鏈上限 30 個快照：超過就從樹重開根提交（build 端 clone 体积有上界）。
          if [ -n "$PARENT" ]; then
            N=$(git rev-list --count "$PARENT" 2>/dev/null || echo 0)
            if [ "$N" -ge 30 ]; then
              SNAP=$(git commit-tree "$TREE" -m "zen1th integration $(date -u +%F) next=${NEXTSHA:0:12} bore+cjktty zen xanmod(best-effort)（父鏈滿 30 重開）")
            fi
          fi
          git update-ref refs/heads/zen1th "$SNAP"
          git config http.version HTTP/1.1
          PUSH_OK=0
          for TRY in 1 2 3; do
            git push -f "$GITURL" "zen1th:refs/heads/zen1th" && { PUSH_OK=1; break; }
            echo "::warning::zen1th 快照 push 第 $TRY 次失敗，30 秒後重試"; sleep 30
          done
          [ "$PUSH_OK" = 1 ] || { echo "::error::zen1th 快照 push 三次全失敗"; exit 1; }
          echo "zen1th 快照 = ${SNAP:0:12}（父 ${PARENT:+${PARENT:0:12}}，樹含 meta；上游歷史不入库）"

      - name: 通知 build
        if: success()
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          curl -fsSL -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d '{"event_type":"integration-ready"}'

      - name: 衝突清單留檔
        if: failure()
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          GITURL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          test -f "$RUNNER_TEMP/conflicts.txt" || echo "（非合併衝突失敗，見日誌）" > "$RUNNER_TEMP/conflicts.txt"
          cat "$RUNNER_TEMP/conflicts.txt"
          git init -q conf && cd conf
          git remote add origin "$GITURL"
          git fetch -q origin zen1th-conflicts 2>/dev/null && git checkout -q -b zen1th-conflicts origin/zen1th-conflicts || git checkout -q -b zen1th-conflicts
          cp "$RUNNER_TEMP/conflicts.txt" "conflicts-$(date -u +%Y%m%dT%H%M%SZ).txt"
          ln -sf "conflicts-$(date -u +%Y%m%dT%H%M%SZ).txt" conflicts-latest.txt
          git add -A; git commit -qm "conflicts $(date -u +%F)" || true
          git push -f origin zen1th-conflicts:zen1th-conflicts
