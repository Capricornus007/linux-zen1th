name: merge-bot（next ⊕ zen ⊕ xanmod ⊕ bore ⊕ cjktty，差量補丁制）
on:
  schedule:
    - cron: "0 1 * * *"   # 每日 09:00 UTC+8
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "重建整合分支（重算 zen/xanmod 差量並重打）"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { path: meta, fetch-depth: 0 }

      - name: 整合
        env:
          FULL: ${{ inputs.full_rebuild }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config --global user.email "zen1th-bot@users.noreply.github.com"
          git config --global user.name  "zen1th-merge-bot"
          git config --global advice.detachedHead false
          GITURL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          NEXTURL="https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git"
          cd meta
          if git ls-remote --exit-code --heads "$GITURL" zen1th >/dev/null 2>&1 && [ "$FULL" != "true" ]; then
            echo "=== 增量：整合分支 ← next 尖端 ==="
            git fetch -q "$GITURL" zen1th
            git checkout -q -b zen1th FETCH_HEAD
            git remote add next "$NEXTURL"
            git fetch --filter=blob:none -q next master:refs/remotes/next/master
            if ! git merge --no-edit -m "merge next $(date -u +%F)" next/master; then
              git diff --name-only --diff-filter=U | tee "$RUNNER_TEMP/conflicts.txt"
              git merge --abort; echo "::error::linux-next 合併衝突"; exit 1
            fi
            git fetch -q "$GITURL" master:refs/remotes/meta/master
            git checkout -q meta/master -- config ci
            git show meta/master:pkgbuild/PKGBUILD > PKGBUILD
            git add -A; git diff --cached --quiet || git commit -qm "sync meta $(date -u +%F)"
            git push -f "$GITURL" HEAD:refs/heads/zen1th
            exit 0
          fi

          echo "=== 全量：差量補丁制重組 ==="
          git init -q src; cd src
          git remote add next   "$NEXTURL"
          git remote add zen    https://github.com/zen-kernel/zen-kernel.git
          git remote add xanmod https://gitlab.com/xanmod/linux.git
          git remote add lin    https://github.com/torvalds/linux.git
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git
          git fetch --filter=blob:none -q next    master:refs/remotes/next/master
          git fetch --filter=blob:none -q lin     master:refs/remotes/lin/master
          git fetch --filter=blob:none -q stable  linux-7.3.y:refs/remotes/stable/linux-7.3.y
          git fetch -q zen    master:refs/remotes/zen/master
          git fetch -q xanmod 7.3:refs/remotes/xanmod/7.3
          git checkout -q -b zen1th next/master

          # 差量基準＝ fork 與權威錨分支的 merge-base。
          # 教訓（run 42388018642）：用「最後一個 Merge tag 'v…」當錨點對 zen 完全失效——
          # zen master 已整個重基到 vanilla 7.4-rc1（樹內全是 Linus 自己的 merge tag），
          # grep 會錨到一年前的舊標籤，差量變成「14 個月全部 stable」，逐檔套用 857 衝突。
          # merge-base 對「跟 Linus 走（無 sauce）」回空差量、對「已疊 sauce」回淨 sauce，
          # 兩種情況都正確。
          make_netdiff() { # $1=fork-ref $2=anchor-ref $3=輸出檔
            local b
            b=$(git merge-base "$1" "$2" 2>/dev/null) || b=""
            if [ -z "$b" ]; then
              echo "$1 與 $2 無共同歷史（merge-base 失敗）"; return 1
            fi
            # 排除：文書、純裝飾檔（CREDITS/MAINTAINERS 署名）、頂層 Makefile（版本號裝飾，
            # 版本由 next 基座決定）；保留 arch/x86/Makefile 等真編譯改動
            git diff --binary "$b" "$1" -- . \
              ':!Documentation' ':!CREDITS' ':!MAINTAINERS' ':!Makefile' \
              ':!LICENSES' ':!README' > "$3"
            echo "$1 差量：$(wc -l < "$3") 行（基準 ${b:0:12} ＝ merge-base($2)，已排除裝飾檔）"
          }
          make_netdiff zen/master     lin/master            /tmp/zen.diff || { echo "::error::zen 差量計算失敗"; exit 1; }
          make_netdiff xanmod/7.3     stable/linux-7.3.y    /tmp/xan.diff || { echo "::error::xanmod 差量計算失敗"; exit 1; }

          apply_diff() { # $1=檔 $2=名稱 $3=required(yes/no)
            # yes：任一衝突即紅（缺了會開不了機/丟特性）。
            # no ：最佳努力層（第三方 sauce 對 next 基座必然漂移）——能套的全套，
            #      衝突檔記清單＋::warning:: 後繼續；清單照常推 zen1th-conflicts 分支。
            if [ ! -s "$1" ]; then echo "$2：差量為空（fork 無自有修改），跳過"; return 0; fi
            if git apply --check --3way "$1" 2>/dev/null; then
              git apply --3way "$1" && git add -A && git commit -qm "$2（差量乾淨）"; return
            fi
            echo "$2：整檔 3way 不行，逐檔套用…"
            local f ok=1 n_apply=0 n_fail=0
            git apply --numstat "$1" | cut -f3 > /tmp/files.txt
            while IFS= read -r f; do
              if git apply --3way --include="$f" "$1" 2>/dev/null; then
                n_apply=$((n_apply+1))
              else
                n_fail=$((n_fail+1)); ok=0
                echo "$2 衝突檔：$f" | tee -a "$RUNNER_TEMP/conflicts.txt"
              fi
            done < /tmp/files.txt
            echo "$2：套用 $n_apply 檔、衝突 $n_fail 檔"
            git add -A; git commit -qm "$2（逐檔套用 $n_apply 檔）" || true
            if [ "$ok" = 0 ]; then
              if [ "$3" = yes ]; then
                echo "::error::$2 有 $n_fail 個衝突檔（清單見 zen1th-conflicts 分支）"; exit 1
              fi
              echo "::warning::$2 有 $n_fail 個衝突檔未套用（best-effort 層；清單見 zen1th-conflicts 分支）"
            fi
          }
          # zen：merge-base 修法後其差量≈0（zen 已無自有 sauce）；真出現 sauce 衝突要紅，
          #      因為 zen 的 scheduler/MM sauce 是用戶點名要的。
          apply_diff /tmp/zen.diff "zen 優化" yes
          # xanmod：官方跟 stable 走、沒有 7.4/rc 分支，sauce 對 next 基座必然漂移
          #        （run 42394838953：binder/tcp/vmscan 17 檔）。最佳努力保留。
          apply_diff /tmp/xan.diff "xanmod 優化" no

          # BORE：若 zen/xanmod 差量已帶來 SCHED_BORE 就不再疊 CachyOS 補丁（避免重複定義）
          if grep -q 'SCHED_BORE' zen.diff xan.diff 2>/dev/null || grep -qr 'config SCHED_BORE' kernel/sched/Kconfig kernel/sched/ 2>/dev/null; then
            echo "SCHED_BORE 已在疊加棧內（lqx/zen 自帶），跳過 CachyOS BORE 補丁"
            grep -qr 'config SCHED_BORE' kernel/sched/ && git log -1 --format='bore-source: %s' 
          else
            # 優先用 BORE 官方（firelzrd/bore-scheduler）對「本基座 kernelversion」發布的
            # 正式檔；CachyOS 目錄版滯後半個週期,對 next 基座會 fair.c 衝突
            # （run 42398532726：官方對 7.4-rc1 的 7.0.1 已合入 next 基座上下文）。
            KVER=$(make -s kernelversion)
            BLIST=$(curl -fsSL "https://api.github.com/repos/firelzrd/bore-scheduler/contents/patches/testing" | jq -r '.[].name' | grep -E "^0001-linux${KVER}(-rc[0-9]+)?-bore-" | sort -V | tail -1 || true)
            if [ -n "$BLIST" ]; then
              curl -fsSLO "https://raw.githubusercontent.com/firelzrd/bore-scheduler/main/patches/testing/${BLIST}"
              patch -Np1 < "$BLIST" || { echo "::error::BORE 官方補丁（$BLIST）衝突"; exit 1; }
              git add -A; git commit -qm "bore（BORE 官方 $BLIST）"
            else
              echo "::warning::BORE 官方尚無 $KVER 的補丁,退回 CachyOS 目錄版"
              MAJ=$(awk '/^VERSION/{v=$3}/^PATCHLEVEL/{p=$3}END{print v"."p}' Makefile)
              curl -fsSLO "https://raw.githubusercontent.com/CachyOS/kernel-patches/master/${MAJ}/sched/0001-bore-cachy.patch"
              patch -Np1 < "0001-bore-cachy.patch" || { echo "::error::CachyOS BORE 補丁衝突"; exit 1; }
              git add -A; git commit -qm "bore（CachyOS ${MAJ}）"
            fi
          fi

          CJ=https://raw.githubusercontent.com/Capricornus007/cjktty-patches/master
          curl -fsSL -o /tmp/cj1.patch "$CJ/v7.x/cjktty-7.4-rc1.patch"
          patch -Np1 < /tmp/cj1.patch || { echo "::error::cjktty 補丁衝突"; exit 1; }
          curl -fsSL -o /tmp/cj2.patch "$CJ/cjktty-add-cjk32x32-font-data.patch"
          patch -Np1 < /tmp/cj2.patch || { echo "::error::cjktty 字型補丁衝突"; exit 1; }
          git add -A; git commit -qm "cjktty v7.x"

          mkdir -p config ci
          cp ../meta/config/* config/; cp ../meta/ci/* ci/
          cp ../meta/pkgbuild/PKGBUILD PKGBUILD
          git add -A; git commit -qm "zen1th meta: PKGBUILD/config/keep/lsmod"
          git push -f "$GITURL" zen1th:refs/heads/zen1th

      - name: 通知 build
        if: success()
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          curl -fsSL -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d '{"event_type":"integration-ready"}'

      - name: 衝突清單留檔
        if: failure()
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          GITURL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          test -f "$RUNNER_TEMP/conflicts.txt" || echo "（非合併衝突失敗，見日誌）" > "$RUNNER_TEMP/conflicts.txt"
          cat "$RUNNER_TEMP/conflicts.txt"
          git init -q conf && cd conf
          git remote add origin "$GITURL"
          git fetch -q origin zen1th-conflicts 2>/dev/null && git checkout -q -b zen1th-conflicts origin/zen1th-conflicts || git checkout -q -b zen1th-conflicts
          cp "$RUNNER_TEMP/conflicts.txt" "conflicts-$(date -u +%Y%m%dT%H%M%SZ).txt"
          ln -sf "conflicts-$(date -u +%Y%m%dT%H%M%SZ).txt" conflicts-latest.txt
          git add -A; git commit -qm "conflicts $(date -u +%F)" || true
          git push -f origin zen1th-conflicts:zen1th-conflicts
